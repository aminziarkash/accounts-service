spring:
  application:
    name: accounts-service
  datasource:
    hikari:
      # wait at most 3s for a row lock instead of forever; the API answers 503 + Retry-After
      connection-init-sql: SET lock_timeout = '3s'
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000 # Without max.block.ms, a send to a dead broker blocks for 60 seconds by default.

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

app:
  outbox:
    topic: accounts.events
    batch-size: 50
    send-timeout: PT5S
    poll-interval: PT0.5S
  security:
    # Keycloak realm. Override both in a container, where the host name differs.
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/accounts}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/accounts/protocol/openid-connect/certs}
  idempotency:
    retention: PT24H
    cleanup-interval: PT1H
  rate-limit:
    enabled: true
    capacity: 10
    refill-per-second: 0.5
  cache:
    profile-max-size: 1000
    profile-ttl: PT5M
  limits-client:
    enabled: true
    base-url: ${LIMITS_BASE_URL:http://localhost:8100}
    connect-timeout: PT0.5S
    read-timeout: PT1S
    resilience:
      retry-max-attempts: 2
      retry-wait: PT0.1S
      breaker-window-size: 10
      breaker-min-calls: 5
      breaker-failure-rate-percent: 50
      breaker-open-duration: PT10S
      breaker-half-open-calls: 2

server:
  shutdown: graceful

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # not ready (no traffic) when the database is unreachable
          include: readinessState,db
