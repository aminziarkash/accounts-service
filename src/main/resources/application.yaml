spring:
  application:
    name: accounts-service
  datasource:
    hikari:
      # wait at most 3s for a row lock instead of forever; the API answers 503 + Retry-After
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

app:
  idempotency:
    retention: PT24H
    cleanup-interval: PT1H
