<text x="118" y="207" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">JWT</text>
<polyline points="220,238 220,166" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="220" cy="203" r="12" fill="#d9372b"/><text x="220" y="207.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="238" y="199" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Login</text>
<text x="238" y="216" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280">username + password</text>
<text x="640" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#2d7a3a">validates the JWT locally (cached Keycloak keys)</text>
<rect x="520" y="240" width="240" height="90" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="640.0" y="290.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Accounts Service</text>
<polyline points="262,276 518,276" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="285" cy="276" r="12" fill="#d9372b"/><text x="285" y="280.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="360" y="258" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Deposit $100 + JWT</text>
<polyline points="518,306 262,306" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="285" cy="306" r="12" fill="#d9372b"/><text x="285" y="310.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">7</text>
<text x="360" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">201 Created</text>
<rect x="880" y="232" width="170" height="106" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2" stroke-dasharray="7 5"/>
<text x="965.0" y="282.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Circuit breaker</text>
<text x="965.0" y="302.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">limits, timeouts</text>
<rect x="1440" y="240" width="220" height="90" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="1550.0" y="282.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Limits Service</text>
<text x="1550.0" y="302.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">owns the limit rules</text>
<polyline points="762,276 878,276" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="800" cy="276" r="12" fill="#d9372b"/><text x="800" y="280.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<polyline points="1052,276 1438,276" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="1320" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">validate limit (HTTP)</text>
<polyline points="1438,306 1052,306" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="1412" cy="306" r="12" fill="#d9372b"/><text x="1412" y="310.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="1320" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">valid / over limit</text>
<polyline points="878,306 762,306" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="455" y="385" width="350" height="240" rx="14" fill="#fff8e1" stroke="#d9372b" stroke-width="1.8" stroke-dasharray="6 4"/>
