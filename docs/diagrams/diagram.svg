<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" font-family="Inter,'Helvetica Neue',Arial,'Liberation Sans',sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f2937"/></marker></defs>
<rect width="2000" height="1200" fill="#fff"/>
<text x="60" y="48" text-anchor="start" font-size="24" font-weight="700" fill="#1f2937">Happy path: a deposit, from request to notification</text>
<text x="60" y="72" text-anchor="start" font-size="14" font-weight="400" fill="#6b7280">accounts-service · transactional outbox, Kafka, idempotent consumer</text>
<line x1="1560" y1="52" x2="1620" y2="52" stroke="#1f2937" stroke-width="2"/>
<text x="1630" y="56" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">synchronous</text>
<line x1="1750" y1="52" x2="1810" y2="52" stroke="#1f2937" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
<text x="1820" y="56" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">asynchronous</text>
<rect x="440" y="150" width="800" height="500" rx="18" fill="#fdf1c7" stroke="#e0b93c" stroke-width="2" stroke-dasharray="3 6"/>
<text x="462" y="180" text-anchor="start" font-size="13" font-weight="700" fill="#9a6b00">PRODUCER · accounts-service</text>
<rect x="1260" y="640" width="330" height="200" rx="18" fill="#dff5e1" stroke="#5fb36a" stroke-width="2" stroke-dasharray="3 6"/>
<text x="1282" y="670" text-anchor="start" font-size="13" font-weight="700" fill="#2d7a3a">CONSUMER · notifications-service</text>
<rect x="1400" y="150" width="300" height="230" rx="18" fill="#e8eefc" stroke="#7b8fd6" stroke-width="2" stroke-dasharray="3 6"/>
<text x="1422" y="180" text-anchor="start" font-size="13" font-weight="700" fill="#3b4fa8">LIMITS · limits-service</text>
<rect x="60" y="100" width="200" height="64" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="160.0" y="137.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Keycloak</text>
<rect x="60" y="240" width="200" height="80" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="160.0" y="277.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Client</text>
<text x="160.0" y="297.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">deposit $100</text>
