<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" font-family="Inter,'Helvetica Neue',Arial,'Liberation Sans',sans-serif">
<defs><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#d9372b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f8a3b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#9ca3af"/></marker></defs>
<rect width="2000" height="1100" fill="#fff"/>
<text x="60" y="48" text-anchor="start" font-size="24" font-weight="700" fill="#1f2937">Scenario 4: a message cannot be processed and goes to the dead-letter topic</text>
<text x="60" y="72" text-anchor="start" font-size="14" font-weight="400" fill="#6b7280">One bad message must not block the stream, and it must not be lost.</text>
<rect x="60" y="250" width="190" height="80" rx="12" fill="#cfe6ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="155.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Kafka</text>
<text x="155.0" y="307.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">accounts.events</text>
<rect x="440" y="250" width="240" height="80" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="560.0" y="295.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Notifications Service</text>
<circle cx="560" cy="250" r="15" fill="#fff" stroke="#d9372b" stroke-width="3"/><path d="M554,244 L566,256 M566,244 L554,256" stroke="#d9372b" stroke-width="3.5" stroke-linecap="round"/>
<polyline points="438,290 252,290" fill="none" stroke="#1f2937" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahi)" stroke-linejoin="round"/>
<circle cx="345" cy="274" r="12" fill="#d9372b"/><text x="345" y="278.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="345" y="314" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280">poll</text>
<polyline points="620,332 620,400 500,400 500,334" fill="none" stroke="#d9372b" stroke-width="2" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="560" cy="400" r="12" fill="#d9372b"/><text x="560" y="404.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<text x="560" y="430" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">3 retries, 1 s apart (partition waits, order kept)</text>
<rect x="900" y="250" width="270" height="80" rx="12" fill="#fff3e0" stroke="#e08a1e" stroke-width="2"/>
<text x="1035.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">accounts.events.DLT</text>
<text x="1035.0" y="307.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">dead-letter topic</text>
<polyline points="682,290 898,290" fill="none" stroke="#d9372b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="790" cy="274" r="12" fill="#d9372b"/><text x="790" y="278.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="790" y="314" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">then dead-letter</text>
<polyline points="560,248 560,190 1035,190 1035,248" fill="none" stroke="#d9372b" stroke-dasharray="8 6" stroke-width="2" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="800" cy="190" r="12" fill="#d9372b"/><text x="800" y="194.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="800" y="176" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">bad data or stale event: straight to the DLT, no retries</text>
<rect x="1310" y="250" width="230" height="80" rx="12" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
<text x="1425.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Alert</text>
<text x="1425.0" y="307.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">DeadLetterTopicNotEmpty</text>
<polyline points="1172,290 1308,290" fill="none" stroke="#1f2937" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahi)" stroke-linejoin="round"/>
<circle cx="1240" cy="274" r="12" fill="#d9372b"/><text x="1240" y="278.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<rect x="1310" y="420" width="300" height="100" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="1460.0" y="467.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Replay</text>
<text x="1460.0" y="487.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">stop group, dry-run, reset offsets, restart</text>
<polyline points="1425,332 1425,418" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ahi)" stroke-linejoin="round"/>
<circle cx="1445" cy="376" r="12" fill="#d9372b"/><text x="1445" y="380.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">6</text>
<text x="1035" y="352" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280">headers: original topic, partition,</text>
<text x="1035" y="370" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280">offset, exception</text>
<rect x="60" y="470" width="860" height="70" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/>
<text x="74" y="492" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">The consumer moves on to the next message. One bad message does not stop the stream.</text>
<text x="74" y="510" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">The balance is correct in Accounts. Only this one notification is missing until it is replayed.</text>
<text x="60" y="668" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">WHAT HAPPENS</text>
<circle cx="72" cy="698" r="12" fill="#d9372b"/><text x="72" y="702.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="96" y="702" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Notifications polls a message it cannot process: a malformed payload, or a temporary failure such as a database</text>
<text x="96" y="719" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">error.</text>
<circle cx="72" cy="749" r="12" fill="#d9372b"/><text x="72" y="753.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<text x="96" y="753" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The error handler retries 3 times, 1 s apart. The partition waits, so the order of events is kept.</text>
<circle cx="72" cy="783" r="12" fill="#d9372b"/><text x="72" y="787.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="96" y="787" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Still failing: the message is published to accounts.events.DLT with headers that say where it came from and why</text>
<text x="96" y="804" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">it failed. The consumer moves on.</text>
<circle cx="72" cy="834" r="12" fill="#d9372b"/><text x="72" y="838.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="96" y="838" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Some errors skip the retries, because retrying cannot help: bad data (IllegalArgumentException) and stale events</text>
<text x="96" y="855" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">(OutOfOrderEventException).</text>
<circle cx="72" cy="885" r="12" fill="#d9372b"/><text x="72" y="889.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="96" y="889" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The alert DeadLetterTopicNotEmpty fires. Someone reads the headers on the dead-lettered message to find the</text>
<text x="96" y="906" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">cause.</text>
<circle cx="72" cy="936" r="12" fill="#d9372b"/><text x="72" y="940.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">6</text>
<text x="96" y="940" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Fix the cause. Stop the consumer group (offsets cannot be reset while it runs), do a dry run, reset the offsets,</text>
<text x="96" y="957" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">restart. Replay is safe, duplicates are skipped.</text>
<rect x="1010" y="650" width="930" height="320" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1032" y="678" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">HOW IT ENDS</text>
<text x="1032" y="708" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Client sees</text>
<text x="1170" y="708" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Nothing. This is all asynchronous, after the 201 Created.</text>
<text x="1032" y="741" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Data</text>
<text x="1170" y="741" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Balances are correct. One notification is missing until replay. Later messages continue to flow.</text>
<text x="1032" y="774" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Signal</text>
<text x="1170" y="774" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">DeadLetterTopicNotEmpty (warn). ConsumerLagHigh (page) if retries hold the partition for long.</text>
<text x="1032" y="807" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Recovery</text>
<text x="1170" y="807" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Manual and deliberate: find the cause, fix it, replay with the runbook. Never replay without a dry</text>
<text x="1170" y="824" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">run first.</text>
<rect x="60" y="990" width="1880" height="76" rx="14" fill="#1f2937"/>
<text x="86" y="1018" text-anchor="start" font-size="11.5" font-weight="700" fill="#9ca3af">SAY IT ALOUD</text>
<text x="86" y="1042" text-anchor="start" font-size="15" font-weight="500" fill="#fff">A message we cannot process is retried three times, then parked in the dead-letter topic with the reason, so the stream keeps moving. We fix it, then replay, and the dedupe makes replay safe.</text>
</svg>