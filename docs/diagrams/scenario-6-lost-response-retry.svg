<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" font-family="Inter,'Helvetica Neue',Arial,'Liberation Sans',sans-serif">
<defs><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#d9372b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f8a3b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#9ca3af"/></marker></defs>
<rect width="2000" height="1100" fill="#fff"/>
<text x="60" y="48" text-anchor="start" font-size="24" font-weight="700" fill="#1f2937">Scenario 6: the response is lost and the client sends the deposit again</text>
<text x="60" y="72" text-anchor="start" font-size="14" font-weight="400" fill="#6b7280">Money must never be credited twice because a network was slow.</text>
<rect x="540" y="110" width="640" height="490" rx="18" fill="#fdf1c7" stroke="#e0b93c" stroke-width="2" stroke-dasharray="3 6"/>
<text x="562" y="140" text-anchor="start" font-size="13" font-weight="700" fill="#9a6b00">PRODUCER · accounts-service</text>
<rect x="60" y="230" width="200" height="190" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="160.0" y="330.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Client</text>
<rect x="580" y="230" width="240" height="190" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="700.0" y="330.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Accounts Service</text>
<polyline points="262,252 578,252" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ahi)" stroke-linejoin="round"/>
<circle cx="290" cy="252" r="12" fill="#d9372b"/><text x="290" y="256.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="420" y="240" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">deposit, Idempotency-Key: K1</text>
<polyline points="578,292 262,292" fill="none" stroke="#d9372b" stroke-width="2" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="430" cy="292" r="15" fill="#fff" stroke="#d9372b" stroke-width="3"/><path d="M424,286 L436,298 M436,286 L424,298" stroke="#d9372b" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="290" cy="292" r="12" fill="#d9372b"/><text x="290" y="296.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="420" y="316" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">response lost (timeout)</text>
<polyline points="262,350 578,350" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ahi)" stroke-linejoin="round"/>
<circle cx="290" cy="350" r="12" fill="#d9372b"/><text x="290" y="354.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="420" y="338" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">retry: same key K1, same body</text>
<polyline points="578,392 262,392" fill="none" stroke="#1f8a3b" stroke-width="2" marker-end="url(#ahg)" stroke-linejoin="round"/>
<circle cx="290" cy="392" r="12" fill="#1f8a3b"/><text x="290" y="396.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="420" y="414" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f8a3b">same result as the first call</text>
<polyline points="700,422 700,460" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ahi)" stroke-linejoin="round"/>
<circle cx="722" cy="441" r="12" fill="#d9372b"/><text x="722" y="445.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<path d="M560,478 v98 a140.0,16 0 0 0 280,0 v-98" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<ellipse cx="700.0" cy="478" rx="140.0" ry="16" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="700.0" y="508" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Accounts DB</text>
<rect x="575" y="516" width="115" height="40" rx="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/>
<text x="632.5" y="540.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">ledger</text>
<rect x="700" y="516" width="125" height="40" rx="7" fill="#f1e8ff" stroke="#1f2937" stroke-width="1.4"/>
<text x="762.5" y="540.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">idempotency</text>
<text x="1010" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#1f8a3b">balance +100</text>
<text x="1010" y="490" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280">outbox row written</text>
<text x="1010" y="508" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280">key K1 stored with the result</text>
<rect x="900" y="525" width="270" height="60" rx="10" fill="#eaf7ee" stroke="#9bd3a8" stroke-width="1.4"/>
<text x="914" y="547" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f8a3b">No second balance change,</text>
<text x="914" y="565" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f8a3b">no second outbox row, no second event.</text>
<rect x="1260" y="230" width="680" height="100" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/>
<text x="1274" y="252" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">Same key, different body: 422 (key reused).</text>
<text x="1274" y="270" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">No key at all: 400, the header is required.</text>
<text x="1274" y="288" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">Two requests with the same key at the same time: the unique key lets one win,</text>
<text x="1274" y="306" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280">the other waits for the result. No double credit.</text>
<text x="60" y="668" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">WHAT HAPPENS</text>
<circle cx="72" cy="698" r="12" fill="#d9372b"/><text x="72" y="702.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="96" y="702" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The client sends a deposit with an Idempotency-Key (K1). The header is required.</text>
<circle cx="72" cy="732" r="12" fill="#d9372b"/><text x="72" y="736.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<text x="96" y="736" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The service commits the balance change, the outbox row and the key K1 with its result.</text>
<circle cx="72" cy="766" r="12" fill="#d9372b"/><text x="72" y="770.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="96" y="770" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The response is lost on the way back: the client times out and does not know if the deposit worked.</text>
<circle cx="72" cy="800" r="12" fill="#d9372b"/><text x="72" y="804.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="96" y="804" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The client retries with the same key K1 and the same body, which is the safe thing to do.</text>
<circle cx="72" cy="834" r="12" fill="#d9372b"/><text x="72" y="838.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="96" y="838" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The service finds K1, does not run the deposit again, and returns the result of the first call.</text>
<rect x="1010" y="650" width="930" height="320" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1032" y="678" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">HOW IT ENDS</text>
<text x="1032" y="708" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Client sees</text>
<text x="1170" y="708" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The same result as the first call, as if it had been sent once.</text>
<text x="1032" y="741" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Data</text>
<text x="1170" y="741" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">One balance change, one ledger entry, one outbox row, one event.</text>
<text x="1032" y="774" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Signal</text>
<text x="1170" y="774" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">None needed on the happy retry. Key reuse with a different body is a 422, which shows a client bug.</text>
<text x="1032" y="807" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Recovery</text>
<text x="1170" y="807" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">None. The client simply retries. Keys are cleaned up later by the cleanup job.</text>
<rect x="60" y="990" width="1880" height="76" rx="14" fill="#1f2937"/>
<text x="86" y="1018" text-anchor="start" font-size="11.5" font-weight="700" fill="#9ca3af">SAY IT ALOUD</text>
<text x="86" y="1042" text-anchor="start" font-size="15" font-weight="500" fill="#fff">The client sends a unique key with every deposit. If the response is lost and it retries with the same key, we return the first result and never apply the money twice.</text>
</svg>