<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" font-family="Inter,'Helvetica Neue',Arial,'Liberation Sans',sans-serif">
<defs><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#d9372b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f8a3b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#9ca3af"/></marker></defs>
<rect width="2000" height="1100" fill="#fff"/>
<text x="60" y="48" text-anchor="start" font-size="24" font-weight="700" fill="#1f2937">Scenario 5: events arrive out of order</text>
<text x="60" y="72" text-anchor="start" font-size="14" font-weight="400" fill="#6b7280">Two relays could swap events. Two protections: one relay at a time, and a guard in the consumer.</text>
<path d="M60,246 v118 a130.0,16 0 0 0 260,0 v-118" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<ellipse cx="190.0" cy="246" rx="130.0" ry="16" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="190.0" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Accounts DB</text>
<rect x="80" y="290" width="100" height="40" rx="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/>
<text x="130.0" y="314.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">row 7</text>
<rect x="190" y="290" width="100" height="40" rx="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/>
<text x="240.0" y="314.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">row 8</text>
<rect x="470" y="150" width="150" height="60" rx="12" fill="#e5dbff" stroke="#6d4fd1" stroke-width="2"/>
<text x="545.0" y="185.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Relay A</text>
<rect x="470" y="400" width="150" height="60" rx="12" fill="#e5dbff" stroke="#6d4fd1" stroke-width="2"/>
<text x="545.0" y="435.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Relay B</text>
<polyline points="322,300 468,185" fill="none" stroke="#1f2937" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahi)" stroke-linejoin="round"/>
<polyline points="322,330 468,425" fill="none" stroke="#1f2937" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahi)" stroke-linejoin="round"/>
<text x="380" y="226" text-anchor="end" font-size="12.5" font-weight="400" fill="#6b7280">holds row 7</text>
<rect x="420" y="268" width="250" height="64" rx="10" fill="#fff8e1" stroke="#e0b93c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="545" y="295" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a6b00">advisory lock</text>
<text x="545" y="315" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">one active relay at a time</text>
<circle cx="440" cy="268" r="12" fill="#d9372b"/><text x="440" y="272.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<rect x="830" y="240" width="190" height="100" rx="12" fill="#cfe6ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="925.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Kafka</text>
<text x="925.0" y="307.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">key = account id</text>
<polyline points="622,180 828,262" fill="none" stroke="#9ca3af" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahm)" stroke-linejoin="round"/>
<text x="720" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280">7, slow</text>
<polyline points="622,430 828,322" fill="none" stroke="#d9372b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="720" cy="390" r="12" fill="#d9372b"/><text x="720" y="394.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="760" y="430" text-anchor="start" font-size="12.5" font-weight="400" fill="#d9372b">8 first, without the lock</text>
<circle cx="395" cy="377" r="15" fill="#fff" stroke="#d9372b" stroke-width="3"/><path d="M389,371 L401,383 M401,371 L389,383" stroke="#d9372b" stroke-width="3.5" stroke-linecap="round"/>
<text x="545" y="482" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">with the lock: B returns at once, publishes nothing</text>
<rect x="1220" y="240" width="260" height="80" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="1350.0" y="285.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Notifications Service</text>
<polyline points="1218,280 1022,280" fill="none" stroke="#1f2937" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahi)" stroke-linejoin="round"/>
<rect x="1240" y="345" width="230" height="38" rx="7" fill="#fff8e1" stroke="#e0b93c" stroke-width="1.4"/>
<text x="1355.0" y="368.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">account_sequences: acct 12 = 8</text>
<circle cx="1236" cy="345" r="12" fill="#d9372b"/><text x="1236" y="349.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<rect x="1220" y="440" width="260" height="70" rx="12" fill="#fff" stroke="#d9372b" stroke-width="2"/>
<text x="1350.0" y="472.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Refused</text>
<text x="1350.0" y="492.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">OutOfOrderEventException</text>
<polyline points="1350,385 1350,438" fill="none" stroke="#d9372b" stroke-width="2" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="1372" cy="412" r="12" fill="#d9372b"/><text x="1372" y="416.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<rect x="1580" y="440" width="200" height="70" rx="12" fill="#fff3e0" stroke="#e08a1e" stroke-width="2"/>
<text x="1680.0" y="480.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">DLT</text>
<polyline points="1482,475 1578,475" fill="none" stroke="#d9372b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahr)" stroke-linejoin="round"/>
<text x="1350" y="540" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">older than 8: refused, not marked processed, no retries</text>
<text x="60" y="668" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">WHAT HAPPENS</text>
<circle cx="72" cy="698" r="12" fill="#d9372b"/><text x="72" y="702.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="96" y="702" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Without protection, two relays can swap events: A holds row 7 while B, skipping locked rows, publishes row 8 first.</text>
<circle cx="72" cy="732" r="12" fill="#d9372b"/><text x="72" y="736.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<text x="96" y="736" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Fix on the producer: a Postgres advisory lock (pg_try_advisory_xact_lock). Only one relay publishes at a time, the other</text>
<text x="96" y="753" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">returns at once. The lock is released on commit, rollback or crash.</text>
<circle cx="72" cy="783" r="12" fill="#d9372b"/><text x="72" y="787.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="96" y="787" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Fix on the consumer: every event carries event-seq (the outbox row id, which only goes up per account). The consumer keeps the</text>
<text x="96" y="804" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">highest sequence it applied per account.</text>
<circle cx="72" cy="834" r="12" fill="#d9372b"/><text x="72" y="838.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="96" y="838" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">If an older event arrives after a newer one, it is refused: the transaction rolls back, it is not marked processed, and it</text>
<text x="96" y="855" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">goes to the DLT without retries.</text>
<circle cx="72" cy="885" r="12" fill="#d9372b"/><text x="72" y="889.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="96" y="889" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Known limit: the guard detects reordering, not gaps. A dead-lettered event 7 followed by an applied 8 means 7 cannot be</text>
<text x="96" y="906" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">replayed as it is. Fine for notifications. A read model needs a gapless version per account.</text>
<rect x="1010" y="650" width="930" height="320" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1032" y="678" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">HOW IT ENDS</text>
<text x="1032" y="708" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Client sees</text>
<text x="1170" y="708" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Nothing.</text>
<text x="1032" y="741" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Data</text>
<text x="1170" y="741" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">A stale event never overwrites a newer one. Order per account is kept: same key, same partition.</text>
<text x="1032" y="774" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Signal</text>
<text x="1170" y="774" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The DLT alert if a stale event is refused. Consumers skipping events show in the skipped and</text>
<text x="1170" y="791" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">duplicates counters.</text>
<text x="1032" y="824" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Cost</text>
<text x="1170" y="824" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">One relay at a time means the publish speed of one relay. The alternative is fixed accounts per</text>
<text x="1170" y="841" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">relay (id modulo).</text>
<rect x="60" y="990" width="1880" height="76" rx="14" fill="#1f2937"/>
<text x="86" y="1018" text-anchor="start" font-size="11.5" font-weight="700" fill="#9ca3af">SAY IT ALOUD</text>
<text x="86" y="1042" text-anchor="start" font-size="15" font-weight="500" fill="#fff">The producer lets only one relay publish at a time, and every event carries a sequence number. If an old event still arrives late, the consumer refuses it instead of overwriting newer data.</text>
</svg>