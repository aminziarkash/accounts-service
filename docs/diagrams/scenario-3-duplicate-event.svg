<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" font-family="Inter,'Helvetica Neue',Arial,'Liberation Sans',sans-serif">
<defs><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#d9372b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f8a3b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#9ca3af"/></marker></defs>
<rect width="2000" height="1100" fill="#fff"/>
<text x="60" y="48" text-anchor="start" font-size="24" font-weight="700" fill="#1f2937">Scenario 3: the relay crashes after publishing, so the event is sent twice</text>
<text x="60" y="72" text-anchor="start" font-size="14" font-weight="400" fill="#6b7280">At-least-once delivery means duplicates are normal. The consumer makes them harmless.</text>
<path d="M60,246 v118 a130.0,16 0 0 0 260,0 v-118" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<ellipse cx="190.0" cy="246" rx="130.0" ry="16" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="190.0" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Accounts DB</text>
<rect x="80" y="290" width="100" height="40" rx="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/>
<text x="130.0" y="314.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">row 42</text>
<rect x="190" y="290" width="110" height="40" rx="7" fill="#fff8e1" stroke="#e0b93c" stroke-width="1.4"/>
<text x="245.0" y="314.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">pending</text>
<rect x="480" y="260" width="140" height="70" rx="12" fill="#e5dbff" stroke="#6d4fd1" stroke-width="2"/>
<text x="550.0" y="300.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Relay</text>
<polyline points="478,300 322,300" fill="none" stroke="#d9372b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="400" cy="300" r="15" fill="#fff" stroke="#d9372b" stroke-width="3"/><path d="M394,294 L406,306 M406,294 L394,306" stroke="#d9372b" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="350" cy="280" r="12" fill="#d9372b"/><text x="350" y="284.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<text x="400" y="338" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">mark row 42 published</text>
<text x="400" y="356" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">(crash before this)</text>
<rect x="830" y="240" width="190" height="100" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="925.0" y="295.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Kafka</text>
<rect x="845" y="300" width="76" height="28" rx="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/>
<text x="883.0" y="318.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">42</text>
<rect x="931" y="300" width="76" height="28" rx="7" fill="#fde8e8" stroke="#d9372b" stroke-width="1.4"/>
<text x="969.0" y="318.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">42 again</text>
<polyline points="622,276 828,276" fill="none" stroke="#1f8a3b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahg)" stroke-linejoin="round"/>
<circle cx="700" cy="260" r="12" fill="#1f8a3b"/><text x="700" y="264.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="725" y="298" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f8a3b">publish 42, acked</text>
<polyline points="622,316 828,316" fill="none" stroke="#d9372b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="700" cy="336" r="12" fill="#d9372b"/><text x="700" y="340.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="725" y="358" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">restart: publish 42 again</text>
<rect x="1220" y="240" width="240" height="100" rx="12" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="1340.0" y="295.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Notifications Service</text>
<polyline points="1022,268 1218,268" fill="none" stroke="#1f8a3b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahg)" stroke-linejoin="round"/>
<circle cx="1120" cy="252" r="12" fill="#1f8a3b"/><text x="1120" y="256.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="1120" y="290" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f8a3b">1st copy delivered</text>
<polyline points="1022,312 1218,312" fill="none" stroke="#d9372b" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="3" marker-end="url(#ahr)" stroke-linejoin="round"/>
<circle cx="1120" cy="332" r="12" fill="#d9372b"/><text x="1120" y="336.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="1120" y="354" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">2nd copy delivered</text>
<path d="M1220,446 v108 a130.0,16 0 0 0 260,0 v-108" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<ellipse cx="1350.0" cy="446" rx="130.0" ry="16" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="1350.0" y="476" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Notifications DB</text>
<rect x="1240" y="488" width="100" height="40" rx="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/>
<text x="1290.0" y="512.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">notifications</text>
<rect x="1350" y="488" width="115" height="40" rx="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/>
<text x="1407.5" y="512.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937">processed-events</text>
<polyline points="1340,342 1340,428" fill="none" stroke="#1f8a3b" stroke-width="2" marker-end="url(#ahg)" stroke-linejoin="round"/>
<text x="1356" y="390" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f8a3b">1st copy: save + mark processed</text>
<rect x="1580" y="262" width="190" height="70" rx="12" fill="#fff" stroke="#d9372b" stroke-width="2"/>
<text x="1675.0" y="294.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Skip</text>
<text x="1675.0" y="314.0" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">commit offset anyway</text>
<polyline points="1462,297 1578,297" fill="none" stroke="#d9372b" stroke-width="2" marker-end="url(#ahr)" stroke-linejoin="round"/>
<text x="1520" y="282" text-anchor="middle" font-size="12.5" font-weight="400" fill="#d9372b">2nd copy</text>
<text x="60" y="668" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">WHAT HAPPENS</text>
<circle cx="72" cy="698" r="12" fill="#d9372b"/><text x="72" y="702.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text>
<text x="96" y="702" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The relay publishes event 42 to Kafka and gets the ack.</text>
<circle cx="72" cy="732" r="12" fill="#d9372b"/><text x="72" y="736.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text>
<text x="96" y="736" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The relay crashes before it marks row 42 as published. Sending to Kafka and updating the row cannot be one transaction, so</text>
<text x="96" y="753" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">this gap always exists.</text>
<circle cx="72" cy="783" r="12" fill="#d9372b"/><text x="72" y="787.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text>
<text x="96" y="787" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">The relay restarts and still sees row 42 as pending. It publishes the same event again. Kafka now holds it twice, both copies</text>
<text x="96" y="804" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">with the same event-id.</text>
<circle cx="72" cy="834" r="12" fill="#d9372b"/><text x="72" y="838.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="96" y="838" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Notifications reads the first copy: the id is not in processed-events, so it saves the notification, marks the id processed</text>
<text x="96" y="855" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">and commits the offset, in one transaction.</text>
<circle cx="72" cy="885" r="12" fill="#d9372b"/><text x="72" y="889.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="96" y="889" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">It reads the second copy: the id is already processed, so it skips it, commits the offset and counts a duplicate.</text>
<rect x="1010" y="650" width="930" height="320" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1032" y="678" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">HOW IT ENDS</text>
<text x="1032" y="708" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Client sees</text>
<text x="1170" y="708" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Nothing. The 201 Created was sent long before.</text>
<text x="1032" y="741" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Data</text>
<text x="1170" y="741" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">One notification per event. No double notification, even though Kafka delivered it twice.</text>
<text x="1032" y="774" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Signal</text>
<text x="1170" y="774" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">Log line "Duplicate event ... ignored" and the duplicates counter. A few of these are healthy, a</text>
<text x="1170" y="791" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">flood means the relay keeps crashing.</text>
<text x="1032" y="824" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937">Recovery</text>
<text x="1170" y="824" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937">None needed. It is handled by design: at-least-once delivery plus an idempotent consumer.</text>
<rect x="60" y="990" width="1880" height="76" rx="14" fill="#1f2937"/>
<text x="86" y="1018" text-anchor="start" font-size="11.5" font-weight="700" fill="#9ca3af">SAY IT ALOUD</text>
<text x="86" y="1042" text-anchor="start" font-size="15" font-weight="500" fill="#fff">Kafka delivery is at least once, so duplicates are normal. The consumer stores each event id in the same transaction as its work, so the second copy is skipped.</text>
</svg>