services:
  postgres:
    image: postgres:16
    container_name: accounts-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accounts}
      POSTGRES_USER: ${POSTGRES_USER:-accounts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounts}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accounts} -d ${POSTGRES_DB:-accounts}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: